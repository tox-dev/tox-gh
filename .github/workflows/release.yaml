name: 🚀 Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: 🏗️ Build
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
    permissions:
      contents: read
  notes:
    name: 📝 Render GitHub Release notes
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: CHANGELOG.md
      artifact-url: https://pypi.org/project/tox-gh/${{ github.ref_name }}/
  publish-pypi:
    name: 🚀 Publish to PyPI
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/tox-gh/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          packages-dir: dist
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [build, notes, publish-pypi]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
    permissions:
      contents: write
    with:
      project: tox-gh
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
      artifact-pattern: python-package-distributions
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
