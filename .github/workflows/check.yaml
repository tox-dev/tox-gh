name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "47 2 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: 🧪 test with ${{ matrix.env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      TOX_TOOLS: ${{ github.workspace }}/.tox/ci-tools
    strategy:
      fail-fast: false
      matrix:
        env:
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os:
          - ubuntu-26.04
          - windows-2025-vs2026
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: ⚙️ Add .local/bin to Windows PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$USERPROFILE/.local/bin" >>"$GITHUB_PATH"
      - name: 📦 Install current tox tools and tox-gh
        shell: bash
        run: |
          uv venv --python 3.15 "$TOX_TOOLS"
          uv pip install --python "$TOX_TOOLS" --group ci .
      - name: ⚙️ Add tox to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "$TOX_TOOLS/Scripts" >>"$GITHUB_PATH"
          else
            echo "$TOX_TOOLS/bin" >>"$GITHUB_PATH"
          fi
      - name: 🐍 Install Python
        if: matrix.env != '3.15'
        run: uv python install --python-preference only-managed ${{ matrix.env }}
      - name: 📦 Setup check suite
        run: tox run -vv --notest --skip-missing-interpreters false
        env:
          TOX_GH_MAJOR_MINOR: ${{ matrix.env }}
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          DIFF_AGAINST: HEAD
          TOX_GH_MAJOR_MINOR: ${{ matrix.env }}
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
        with:
          needs: ${{ toJSON(needs) }}
