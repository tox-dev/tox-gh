name: check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: test with ${{ matrix.env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      TOX_TOOLS: ${{ github.workspace }}/.tox/ci-tools
    strategy:
      fail-fast: false
      matrix:
        env:
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os:
          - ubuntu-26.04
          - macos-26
          - windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the uv version bundled with setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add .local/bin to Windows PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$USERPROFILE/.local/bin" >>"$GITHUB_PATH"
      - name: Install current tox tools and tox-gh
        shell: bash
        run: |
          uv venv --python 3.15 "$TOX_TOOLS"
          uv pip install --python "$TOX_TOOLS" --group ci .
      - name: Add tox to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "$TOX_TOOLS/Scripts" >>"$GITHUB_PATH"
          else
            echo "$TOX_TOOLS/bin" >>"$GITHUB_PATH"
          fi
      - name: Install Python
        if: matrix.env != '3.15'
        run: uv python install --python-preference only-managed ${{ matrix.env }}
      - name: Setup test suite
        run: tox run -vv --notest --skip-missing-interpreters false
        env:
          TOX_GH_MAJOR_MINOR: ${{ matrix.env }}
      - name: Run test suite
        run: tox run --skip-pkg-install
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          DIFF_AGAINST: HEAD
          TOX_GH_MAJOR_MINOR: ${{ matrix.env }}
  hook-update-cooldown:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/check-hook-update-cooldown@74472c1a3602ca9b66db058ea31578865e1d208b
  gate:
    name: Required checks pass
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, hook-update-cooldown]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(
              to_entries[];
              .value.result == "success" or
              ((.key == "hook-update-cooldown") and
                .value.result == "skipped" and $event != "pull_request")
            )
          ' <<<"$NEEDS_JSON"
