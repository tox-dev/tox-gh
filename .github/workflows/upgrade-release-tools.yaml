name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@7afb8fc8fd51942c5deedf9012dd49ed9c7b5bc1
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      python-version: "3.15"
      check-workflow: check.yaml
