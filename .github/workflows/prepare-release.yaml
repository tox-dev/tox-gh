name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump strategy
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@7afb8fc8fd51942c5deedf9012dd49ed9c7b5bc1
    permissions:
      contents: read
      pull-requests: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      bump: ${{ inputs.bump }}
      changelog: CHANGELOG.md
      fragments: changelog.d
      format: markdown
