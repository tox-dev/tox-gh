[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "python-sbom[hatch]>=0.1.2",
]

[project]
name = "tox-gh"
import-names = [ "tox_gh" ]
description = "Seamless integration of tox into GitHub Actions."
keywords = [
  "github-actions",
  "integration",
  "tox",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "tox>=4.64.7",
  "typing-extensions>=4.16; python_version<'3.12'",
]
urls.Changelog = "https://github.com/tox-dev/tox-gh/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/tox-dev/tox-gh#tox-gh"
urls.Homepage = "https://github.com/tox-dev/tox-gh"
urls.Source = "https://github.com/tox-dev/tox-gh"
urls.Tracker = "https://github.com/tox-dev/tox-gh/issues"
entry-points.tox.tox-gh = "tox_gh.plugin"

[dependency-groups]
test = [
  "covdefaults>=2.3",
  "devpi-process>=1.2",
  "diff-cover>=10.6",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.16",
]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "python-sbom[hatch]>=0.1.2",
  "setuptools>=80",
]
ci = [ "tox-uv>=1.36.1" ]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=7",
  "uv>=0.12.22",
]
release = [
  "prek>=0.5",
  "release-creator>=4.4",
  "towncrier>=26.9",
]
release-news = [
  "release-creator>=4.4",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=4.4",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=4.4",
  "towncrier>=26.9",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = '''(?x)
    (?<!!)\[(?P<label>[^\]]+)\]\( # Link text, excluding images
    (?P<path>CHANGELOG\.md|CONTRIBUTING\.md) # Repository files linked from the README
    \)
    ''', replacement = '[\g<label>](https://github.com/tox-dev/tox-gh/blob/main/\g<path>)' },
]
build.hooks.vcs.version-file = "src/tox_gh/version.py"
build.hooks.python-sbom = {}
build.targets.sdist.include = [
  "/src",
  "/tests",
]

[tool.uv]
dependency-groups.release = { requires-python = ">=3.15" }
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # No copyright statements
  "docstring-missing-exception",               # simplint checks reST :raises: fields
  "docstring-missing-returns",                 # simplint checks reST :returns: fields
  "docstring-missing-yields",                  # simplint checks reST :yields: fields
  "incorrect-blank-line-before-class",         # Conflicts with `blank-line-before-class`
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # Conflicts with `multi-line-summary-second-line`
  "single-line-implicit-string-concatenation", # Conflict with formatter
  "undocumented-magic-method",                 # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-class",                 # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-function",              # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-init",                  # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-method",                # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-nested-class",          # undocumented-public-api (simplint) covers the public API instead
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                     # asserts allowed in tests
  "D",                          # don't care about documentation in tests
  "implicit-namespace-package", # no implicit namespace
  "pytest-fixture-autouse",     # shared setup fixtures are meant to apply to every test
]
lint.isort = { known-first-party = [
  "tox_gh",
  "tests",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
write-changes = true
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.15"

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.other = [
  ".",
  "*/tox_gh",
  "*\\tox_gh",
]
paths.source = [
  "src",
  ".tox/*/lib/*/site-packages",
  ".tox\\*\\Lib\\site-packages",
  "**/src",
  "**\\src",
]
report.fail_under = 96
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "tox-gh"
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "release_creator.fragments:template.jinja2"
title_format = false
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.python-sbom]
supplier = { name = "tox-dev", url = [ "https://github.com/tox-dev" ] }

[tool.nab]
mode = "universal"
base-group = "project-runtime"
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64", "macos_arm64", "windows_amd64" ]
# The 2026-11-03 lock needs this cutoff to include release-creator 4.4.0.
# expires 2026-11-16
packages.release-creator.uploaded-prior-to = 2026-11-02T21:45:00Z
# python-sbom 0.1.2 needs a seven-day cutoff exception.
# expires 2026-11-15
packages.python-sbom.uploaded-prior-to = 2026-11-08T17:54:00Z

[tool.simplint]
docstring-style = "rst"
