default_language_version:
  python: python3.15
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
      - id: trailing-whitespace
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
        additional_dependencies:
          - "attrs==26.1.0" # release-creator managed
          - "certifi==2026.7.22" # release-creator managed
          - "charset-normalizer==3.5.2" # release-creator managed
          - "click==8.5.0" # release-creator managed
          - "idna==3.20" # release-creator managed
          - "jsonschema==4.26.0" # release-creator managed
          - "jsonschema-specifications==2025.9.1" # release-creator managed
          - "referencing==0.37.0" # release-creator managed
          - "regress==2026.9.1" # release-creator managed
          - "requests==2.34.2" # release-creator managed
          - "rpds-py==2026.9.1" # release-creator managed
          - "ruamel-yaml==0.19.1" # release-creator managed
          - "urllib3==2.8.0" # release-creator managed
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        args: ["-ignore", 'label "ubuntu-26[.]04" is unknown'] # GitHub offers this runner before actionlint lists it.
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
        additional_dependencies:
          - "pyproject-fmt==2.30.3" # release-creator managed
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "38bfb07c0c64c304f47eb52090f8288150c77730" # frozen: v0.17.1
    hooks:
      - id: ruff-format
        additional_dependencies:
          - "ruff==0.17.1" # release-creator managed
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
        additional_dependencies:
          - "ruff==0.17.1" # release-creator managed
  - repo: https://github.com/hukkin/mdformat
    rev: "82912cdaea4fb830f751504486a7879c70526547" # frozen: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-config==0.2.1
          - mdformat-gfm==1.0.0
          - mdformat-toc==0.5.0
          - "markdown-it-py==4.2.0" # release-creator managed
          - "mdit-py-plugins==0.6.1" # release-creator managed
          - "mdurl==0.1.2" # release-creator managed
          - "ruamel-yaml==0.19.1" # release-creator managed
          - "taplo==0.9.3" # release-creator managed
          - "wcwidth==0.9.2" # release-creator managed
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        additional_dependencies:
          - "zizmor==1.31.1" # release-creator managed
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
