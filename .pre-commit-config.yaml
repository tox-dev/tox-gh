# prek runs lower priorities first and equal ones concurrently, so hooks sharing a priority never write the same
# file; pre-commit ignores the key and runs hooks in file order.
ci:
  autoupdate_schedule: quarterly
default_language_version:
  python: python3.15
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        priority: 0
      - id: trailing-whitespace
        priority: 1
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
        priority: 6
        args: ["--verbose"]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        priority: 6
        args: ["-ignore", 'label "ubuntu-26[.]04" is unknown'] # GitHub offers this runner before actionlint lists it.
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        priority: 6
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
        priority: 2
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c" # frozen: v0.17.3
    hooks:
      - id: ruff-check
        priority: 3
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
  - repo: https://github.com/gaborbernat/simplint-pre-commit
    rev: "c8719dca99c13381570bc69f8955c9448fc271b7" # frozen: v0.7.1
    hooks:
      - id: simplint
        priority: 4
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c" # frozen: v0.17.3
    hooks:
      - id: ruff-format
        priority: 5
  - repo: https://github.com/hukkin/mdformat
    rev: "82912cdaea4fb830f751504486a7879c70526547" # frozen: 1.0.0
    hooks:
      - id: mdformat
        priority: 2
        additional_dependencies:
          - mdformat-config==0.2.1
          - mdformat-gfm==1.0.0
          - mdformat-toc==0.5.0
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        priority: 2
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        priority: 6
  - repo: meta
    hooks:
      - id: check-hooks-apply
        priority: 6
      - id: check-useless-excludes
        priority: 6
